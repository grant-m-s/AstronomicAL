[pytest]
testpaths = tests
python_files = test_*.py

addopts =
    -m "not plugin_quality and not slow"

markers =
    unit: fast unit tests for platform services
    contract: tests that enforce platform/plugin contracts
    plugin_quality: opt-in tests for plugin authoring quality, slow loading, and coupling
    integration: tests that combine multiple platform services
    slow: large or intentionally slow tests
    legacy: old pre-plugin tests kept during migration